name: 이미지 푸시 (GHCR)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  push:
    name: Build and push to GHCR
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 배포 쪽에서는 latest 를 쓰고, sha 태그는 되돌릴 때를 위해 같이 남긴다.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/team-storix/storix-mcp:latest
            ghcr.io/team-storix/storix-mcp:${{ github.sha }}
