name: STORIX CD - Publish to npm

# main 에 Release 커밋(squash, 'Release vX.Y.Z (#N)')이 들어오면 태그 · GitHub Release 를 만들고 npm 에 올린다 (#80).
# 기본 토큰으로 만든 릴리스는 다른 워크플로를 깨우지 않아 한 파일에서 이어서 한다.
# Trusted Publishing 이 이 파일 이름(publish.yml)으로 등록돼 있어 이름을 바꾸지 않는다.
# 수동 실행(workflow_dispatch)은 태그 없이 지금 package.json 버전을 다시 올린다 (배포만 실패했을 때).
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  tag:
    name: 태그 · GitHub Release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Release 커밋이면 태그 · 릴리스
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: python3 scripts/release_notes.py "$MESSAGE" "$GITHUB_SHA"

  publish:
    name: npm 에 올리기
    needs: tag
    if: always() && (github.event_name == 'workflow_dispatch' || needs.tag.outputs.version != '')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci --omit=dev

      # 올리기 전에 실제로 뜨는지 본다. 깨진 패키지가 나가면 되돌리기 번거롭다.
      - name: 기동 확인
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | node src/index.js > out.json
          node -e 'const l=require("fs").readFileSync("out.json","utf8").trim().split("\n").map(JSON.parse);
                   const t=l.find(m=>m.id===2)?.result?.tools||[];
                   if(!t.length){console.error("툴이 없습니다");process.exit(1)}
                   console.log("툴",t.length,"개")'

      # Trusted Publishing - 토큰 없이 OIDC 로 인증한다.
      # npm 11.5.1+ 가 필요해 Node 24 를 쓴다 (번들 npm 11.19.0).
      - run: npm publish --access public
