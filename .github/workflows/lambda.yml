name: Lambda 패키지

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '.github/workflows/lambda.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: zip 만들고 올리기
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 런타임에 어떤 SDK 가 번들돼 있는지는 버전마다 다르다. 직접 담아 그 의존을 없앤다.
      # 노트북에서 쓰는 쪽은 fs 백엔드라 client-s3 가 필요 없어 package.json 에는 넣지 않는다.
      - name: SDK 설치
        run: npm install --no-save --omit=dev @aws-sdk/client-s3 @aws-sdk/client-ssm

      - name: zip 만들기
        run: |
          # package.json 이 있어야 "type": "module" 이 적용돼 ESM 으로 읽힌다
          zip -rq lambda.zip package.json src node_modules \
            -x 'src/http.js' 'src/index.js' 'src/server.js' 'src/modules/index.js'
          unzip -l lambda.zip | tail -1

      - uses: actions/upload-artifact@v4
        with:
          name: lambda-package
          path: lambda.zip

      # AWS 역할이 준비되면 아래를 켠다. 그 전까지는 아티팩트로만 남는다.
      # - uses: aws-actions/configure-aws-credentials@v4
      #   with:
      #     role-to-assume: ${{ secrets.LAMBDA_DEPLOY_ROLE_ARN }}
      #     aws-region: ap-northeast-2
      # - run: aws lambda update-function-code --function-name storix-spec-changelog --zip-file fileb://lambda.zip
