name: STORIX CD - Deploy Lambda

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '.github/workflows/lambda.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  package:
    name: zip 만들고 올리기
    runs-on: ubuntu-latest
    env:
      ROLE: ${{ secrets.LAMBDA_DEPLOY_ROLE_ARN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 런타임에 어떤 SDK 가 번들돼 있는지는 버전마다 다르다. 직접 담아 그 의존을 없앤다.
      - name: SDK 설치
        run: npm install --no-save --omit=dev @aws-sdk/client-s3 @aws-sdk/client-ssm

      - name: zip 만들기
        run: |
          # package.json 이 있어야 "type": "module" 이 적용돼 ESM 으로 읽힌다
          zip -rq lambda.zip package.json src node_modules \
            -x 'src/http.js' 'src/index.js' 'src/server.js' 'src/modules/index.js'
          unzip -l lambda.zip | tail -1

      - uses: actions/upload-artifact@v4
        with:
          name: lambda-package
          path: lambda.zip

      # 역할이 준비돼 있으면 함수까지 갱신한다.
      # LAMBDA_DEPLOY_ROLE_ARN 이 없으면 건너뛴다 - 아티팩트는 그대로 남는다.
      - name: AWS 자격증명 (OIDC)
        if: ${{ env.ROLE != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE }}
          aws-region: ap-northeast-2

      - name: 함수 코드 갱신
        if: ${{ env.ROLE != '' }}
        run: |
          aws lambda update-function-code \
            --function-name storix-spec-changelog \
            --region ap-northeast-2 \
            --zip-file fileb://lambda.zip \
            --query '{sha:CodeSha256,size:CodeSize}' --output table
          aws lambda wait function-updated-v2 \
            --function-name storix-spec-changelog --region ap-northeast-2
          echo "갱신 완료"
