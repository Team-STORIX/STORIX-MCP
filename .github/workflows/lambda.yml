name: Lambda 패키지

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '.github/workflows/lambda.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: zip 만들고 올리기
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # CLI·핸들러가 쓰는 파일에는 외부 패키지가 없다. src 만 담으면 된다.
      - name: zip 만들기
        run: |
          zip -r lambda.zip src -x 'src/http.js' 'src/index.js' 'src/server.js' 'src/modules/index.js'
          unzip -l lambda.zip | tail -1

      - uses: actions/upload-artifact@v4
        with:
          name: lambda-package
          path: lambda.zip

      # AWS 역할이 준비되면 아래를 켠다. 그 전까지는 아티팩트로만 남는다.
      # - uses: aws-actions/configure-aws-credentials@v4
      #   with:
      #     role-to-assume: ${{ secrets.LAMBDA_DEPLOY_ROLE_ARN }}
      #     aws-region: ap-northeast-2
      # - run: aws lambda update-function-code --function-name storix-spec-changelog --zip-file fileb://lambda.zip
