name: STORIX CI - Syntax & Startup Check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # 공개 저장소라 운영 값(DB · 계정 · 인스턴스 이름, 계정 ID 등)이 들어오면 막는다.
  # 목록 자체도 공개되면 안 되므로 저장소 Secret(PUBLIC_REPO_BLOCKLIST, 한 줄에 하나)에 둔다.
  # 머지 커밋으로 합치므로 지금 파일뿐 아니라 이번에 들어오는 커밋들의 변경 · 메시지까지 본다.
  # 어느 값이 걸렸는지는 로그에 남기지 않고 파일 이름만 보여준다.
  blocklist:
    name: 운영 값 노출 검사
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 운영 값 검사
        env:
          BLOCKLIST: ${{ secrets.PUBLIC_REPO_BLOCKLIST }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BLOCKLIST" ]; then
            # 포크에서 온 PR 은 Secret 을 못 받는다. 머지 뒤 main 푸시에서 다시 본다
            echo "::warning::PUBLIC_REPO_BLOCKLIST 를 읽지 못해 건너뜁니다"
            exit 0
          fi
          printf '%s\n' "$BLOCKLIST" | grep -v '^#' | grep -v '^$' > /tmp/blocklist
          fail=0

          files=$(git grep -lFf /tmp/blocklist -- . || true)
          if [ -n "$files" ]; then
            echo "::error::지금 파일에 운영 값이 있습니다"
            echo "$files"
            fail=1
          fi

          if git cat-file -e "$BASE" 2>/dev/null && [ "$BASE" != "0000000000000000000000000000000000000000" ]; then
            commits=$(git rev-list "$BASE..$HEAD")
            for c in $commits; do
              hit=$(git show --format= -U0 --no-color "$c" | grep '^+' | grep -v '^+++' | grep -cFf /tmp/blocklist || true)
              msg=$(git log -1 --format=%B "$c" | grep -cFf /tmp/blocklist || true)
              if [ "$hit" != "0" ] || [ "$msg" != "0" ]; then
                echo "::error::커밋 $(git log -1 --format='%h %s' "$c") 에 운영 값이 있습니다 (변경 ${hit}줄 · 메시지 ${msg}줄)"
                fail=1
              fi
            done
          fi

          [ "$fail" = 0 ] && echo "운영 값 $(wc -l < /tmp/blocklist)개 검사 통과"
          exit $fail

  check:
    name: 구문 검사와 기동 확인
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci

      - name: 구문 검사
        run: |
          find src smoke-http.mjs -name '*.js' -o -name '*.mjs' | while read -r f; do
            node --check "$f" || exit 1
          done

      - name: 테스트
        run: npm test

      # 실제로 서버를 띄워 툴과 프롬프트가 등록되는지 본다.
      # 모듈 하나가 깨지면 등록 단계에서 죽으므로 여기서 잡힌다.
      - name: 기동 확인
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            '{"jsonrpc":"2.0","id":3,"method":"prompts/list"}' \
            | node src/index.js > out.json

          node -e '
            const lines = require("fs").readFileSync("out.json", "utf8").trim().split("\n");
            const byId = Object.fromEntries(
              lines.map((l) => JSON.parse(l)).filter((m) => m.id).map((m) => [m.id, m])
            );
            const tools = byId[2]?.result?.tools ?? [];
            const prompts = byId[3]?.result?.prompts ?? [];
            console.log(`툴 ${tools.length}개 · 프롬프트 ${prompts.length}개`);
            if (!tools.length) { console.error("툴이 하나도 등록되지 않았습니다"); process.exit(1); }
            if (!prompts.length) { console.error("프롬프트가 등록되지 않았습니다"); process.exit(1); }
            const bad = tools.filter((t) => !/^(swagger|auth|report|metrics|mobile|flow|dev_server|db)_/.test(t.name));
            if (bad.length) { console.error("모듈 접두사가 없는 툴: " + bad.map((t) => t.name).join(", ")); process.exit(1); }
          '

      # 문서에 적힌 환경변수가 코드에 실제로 있는지 본다. 문서만 있는 변수는 거짓말이 된다
      - name: 문서와 환경변수 대조
        run: |
          grep -rhoE 'process\.env\.[A-Z_]+' src/ | sed 's/process\.env\.//' | sort -u > /tmp/code.txt
          grep -oE '`[A-Z][A-Z_]{4,}`' README.md | tr -d '`' | sort -u > /tmp/doc.txt
          missing=$(comm -13 /tmp/code.txt /tmp/doc.txt | grep -v '^NAMESPACE$' || true)
          if [ -n "$missing" ]; then
            echo "README 에만 있고 코드에는 없는 환경변수:"
            echo "$missing"
            exit 1
          fi
          echo "환경변수 $(wc -l < /tmp/code.txt)개 일치"
